version: 2
updates:
  - package-ecosystem: npm
    directory: /wandao_electron
    schedule:
      interval: weekly
    auto-merge:
      enabled: true
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    auto-merge:
      enabled: true
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    auto-merge:
      enabled: true
    open-pull-requests-limit: 5
